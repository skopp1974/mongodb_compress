services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      # Set these in deployment/.env (recommended) to enable auth.
      # If you leave them empty, MongoDB will start without authentication.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
    volumes:
      - ../db:/data/db
      - ./initdb:/docker-entrypoint-initdb.d:ro

